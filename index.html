<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>John's To-Do List</title>
<style>
  /* ---------- Colors (light and dark mode) ---------- */
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --text: #1f1d1a;
    --muted: #7a756d;
    --line: #e4e0d8;
    --accent: #2e9e5b;
    --done: #a8a39a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1917;
      --card: #252421;
      --text: #ece9e3;
      --muted: #9a958c;
      --line: #3a3834;
      --accent: #4cc27f;
      --done: #6b675f;
    }
  }

  /* ---------- Layout ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
  }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .count { color: var(--muted); margin: 0 0 20px; font-size: 14px; }

  /* ---------- The "add a task" box ---------- */
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }
  button.add {
    padding: 10px 16px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    cursor: pointer;
  }

  /* ---------- The task list ---------- */
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  li span { flex: 1; font-size: 16px; }
  li.done span { text-decoration: line-through; color: var(--done); }
  li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  button.delete {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
  }
  button.delete:hover { color: #d9534f; }
  .empty { color: var(--muted); text-align: center; padding: 20px 0; }

  /* ---------- The "clear completed" button ---------- */
  button.clear {
    display: block;
    margin: 16px auto 0;
    padding: 8px 14px;
    font-size: 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  button.clear:hover { color: var(--text); }
  button.clear[hidden] { display: none; }

  /* ---------- Sync status and the "copy link" button ---------- */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
  }
  .footer button {
    border: none;
    background: none;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    padding: 0;
  }
  .status.error { color: #d9534f; }
</style>
</head>
<body>
  <div class="app">
    <h1>John's To-Do List</h1>
    <p class="count" id="count"></p>

    <form id="form">
      <input type="text" id="newTask" placeholder="What do you need to do?" autocomplete="off">
      <button class="add" type="submit">Add</button>
    </form>

    <ul id="list"></ul>

    <button class="clear" id="clear" type="button">Clear completed</button>

    <div class="footer">
      <span class="status" id="status">Loading…</span>
      <button id="copyLink" type="button">Copy link for your other devices</button>
    </div>
  </div>

<script>
  // ---------- Which list is this? ----------
  // Each list has a long random ID in the address (?list=...). Opening the same
  // address on another device shows the same list. This browser also remembers
  // its list, so visiting the plain address brings you back to it.
  function newListId() {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    return Array.from(bytes, b => b.toString(36).padStart(2, "0")).join("");
  }

  function remembered(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  const params = new URLSearchParams(location.search);
  const isNewList = !params.get("list") && !remembered("listId");
  const listId = params.get("list") || remembered("listId") || newListId();
  try { localStorage.setItem("listId", listId); } catch (e) {}
  params.set("list", listId);
  history.replaceState(null, "", "?" + params.toString());

  const apiUrl = "/api/tasks?list=" + encodeURIComponent(listId);
  let tasks = [];

  // ---------- Talking to the backend ----------
  function setStatus(text, isError) {
    const status = document.getElementById("status");
    status.textContent = text;
    status.className = isError ? "status error" : "status";
  }

  async function load() {
    try {
      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error("Server said " + response.status);
      tasks = (await response.json()).tasks;

      // Bring over tasks this browser saved before the app had a backend.
      const oldTasks = JSON.parse(remembered("tasks") || "[]");
      if (isNewList && tasks.length === 0 && oldTasks.length > 0) {
        tasks = oldTasks;
        save();
      } else {
        setStatus("Synced");
      }
    } catch (e) {
      setStatus("Couldn't load your tasks. Check your connection and refresh.", true);
    }
    render();
  }

  // Saves run one after another, so an older save can't overwrite a newer one.
  let saving = Promise.resolve();
  function save() {
    const snapshot = JSON.stringify({ tasks: tasks });
    setStatus("Saving…");
    saving = saving.then(async () => {
      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: snapshot,
        });
        if (!response.ok) throw new Error("Server said " + response.status);
        setStatus("Synced");
      } catch (e) {
        setStatus("Couldn't save. Your last change may be lost.", true);
      }
    });
  }

  // ---------- Copy this list's link ----------
  document.getElementById("copyLink").onclick = async () => {
    const button = document.getElementById("copyLink");
    try {
      await navigator.clipboard.writeText(location.href);
      button.textContent = "Link copied!";
    } catch (e) {
      button.textContent = "Copy the address bar instead";
    }
    setTimeout(() => { button.textContent = "Copy link for your other devices"; }, 2000);
  };

  // ---------- Draw the list on screen ----------
  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    if (tasks.length === 0) {
      list.innerHTML = '<li class="empty">Nothing here yet. Add your first task above!</li>';
    }

    tasks.forEach((task, index) => {
      const item = document.createElement("li");
      if (task.done) item.className = "done";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.done;
      checkbox.onchange = () => { task.done = !task.done; save(); render(); };

      const text = document.createElement("span");
      text.textContent = task.text;

      const del = document.createElement("button");
      del.className = "delete";
      del.textContent = "✕";
      del.title = "Delete";
      del.onclick = () => { tasks.splice(index, 1); save(); render(); };

      item.append(checkbox, text, del);
      list.append(item);
    });

    const left = tasks.filter(t => !t.done).length;
    document.getElementById("count").textContent =
      left === 1 ? "1 task left" : left + " tasks left";

    // Only show "Clear completed" when there's something to clear
    document.getElementById("clear").hidden = !tasks.some(t => t.done);
  }

  // ---------- Remove all finished tasks ----------
  document.getElementById("clear").onclick = () => {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  };

  // ---------- Add a new task when you press Add ----------
  document.getElementById("form").onsubmit = (event) => {
    event.preventDefault();
    const input = document.getElementById("newTask");
    const text = input.value.trim();
    if (text) {
      tasks.push({ text: text, done: false });
      input.value = "";
      save();
      render();
    }
  };

  load();
</script>
</body>
</html>
